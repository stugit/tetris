<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        <div id="game-area">
            <div id="left-panel">
                <div class="stat">
                    <span class="label" data-tooltip="Your all-time high score">BEST</span>
                    <span id="high-score">0</span>
                </div>
                <div class="stat">
                    <span class="label" data-tooltip="Pieces Per Second — how fast you're placing pieces">PPS</span>
                    <span id="pps">0.00</span>
                </div>
                <div class="stat">
                    <span class="label" data-tooltip="Keys Per Piece — input efficiency (lower is better)">KPP</span>
                    <span id="kpp">0.00</span>
                </div>
                <div id="hold-container">
                    <span class="label" data-tooltip="Hold a piece to use later (C or Shift)">HOLD</span>
                    <canvas id="hold" width="120" height="120"></canvas>
                </div>
                <div id="settings">
                    <div class="setting-group">
                        <label class="setting-item" data-tooltip="Toggle background music"><input type="checkbox" id="music-check" checked> MUSIC</label>
                        <input type="range" id="music-vol" min="0" max="1" step="0.05" value="0.4">
                    </div>
                    <div class="setting-group">
                        <label class="setting-item" data-tooltip="Toggle sound effects"><input type="checkbox" id="sfx-check" checked> SFX</label>
                        <input type="range" id="sfx-vol" min="0" max="1" step="0.05" value="1.0">
                    </div>
                    <div class="setting-group">
                        <label class="setting-item" data-tooltip="Delayed Auto-Shift — delay (ms) before a held key starts repeating">DAS (ms)</label>
                        <input type="range" id="das-slider" min="0" max="300" step="10" value="150">
                    </div>
                    <div class="setting-group">
                        <label class="setting-item" data-tooltip="Auto-Repeat Rate — speed (ms) of movement while a key is held">ARR (ms)</label>
                        <input type="range" id="arr-slider" min="0" max="100" step="5" value="30">
                    </div>
                    <div class="setting-group">
                        <label class="setting-item" data-tooltip="Soft Drop Rate — downward speed multiplier when pressing ↓">SDR (x)</label>
                        <input type="range" id="sdr-slider" min="1" max="50" step="1" value="20">
                    </div>
                    <div class="setting-group">
                        <label class="setting-item" data-tooltip="Disable gravity — pieces won't fall on their own"><input type="checkbox" id="zen-check"> ZEN MODE</label>
                    </div>
                    <div class="setting-group">
                        <label class="setting-item" data-tooltip="Show a shadow where the piece will land"><input type="checkbox" id="ghost-check" checked> GHOST PIECE</label>
                    </div>
                    <div class="setting-group" id="logout-group" style="display: none;">
                        <button id="logout-btn">SIGN OUT</button>
                    </div>
                </div>
            </div>
            <div id="center-column">
                <h1>TETRIS</h1>
                <div id="canvas-container">
                    <canvas id="board" width="300" height="600"></canvas>
                    <div id="overlay">
                        <p id="overlay-msg">Tap or press Space to Start</p>
                        <button id="login-btn" style="display: none;">LOGIN WITH GITHUB</button>
                        <div id="leaderboard-container"></div>
                        <p id="validation-msg" style="display: none; font-size: 0.9rem; margin-top: 15px; color: #888; font-style: italic;"></p>
                    </div>
                </div>
            </div>
            <div id="panel">
                <div class="stat">
                    <span class="label" data-tooltip="Current game score">SCORE</span>
                    <span id="score">0</span>
                </div>
                <div class="stat">
                    <span class="label" data-tooltip="Current level — increases every 10 lines cleared">LEVEL</span>
                    <span id="level">1</span>
                </div>
                <div class="stat">
                    <span class="label" data-tooltip="Total lines cleared this game">LINES</span>
                    <span id="lines">0</span>
                </div>
                <div id="next-container">
                    <span class="label" data-tooltip="Upcoming pieces in the queue">NEXT</span>
                    <canvas id="next" width="120" height="360"></canvas>
                </div>
            </div>
            <div id="controls">
                <p>← → &nbsp;&nbsp;Move</p>
                <p>↑ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Rotate CW</p>
                <p>Z &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Rotate CCW</p>
                <p>↓ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Soft drop</p>
                <p>Space &nbsp;Hard drop</p>
                <p>C / ⇧ &nbsp;&nbsp;Hold</p>
                <p>P &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Pause</p>
                <p>M &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Mute</p>
            </div>
        </div>
    </div>
    <script type="module" src="game.js"></script>
</body>
</html>
